[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "firmware"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.53", features = ["critical-section"] }
obdient = { path = "../obdient", default-features = false }
anyhow = "1.0.104"

[build-dependencies]
embuild = "0.33.5"
